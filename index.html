<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="There's more coming.">
  <meta name="theme-color" content="#f3ede2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
  <title>There's more coming</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d9542b'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3ede2;
      --ink: #1c1814;
      --muted: #7a6f63;
      --accent: #d9542b;
      --rule: #d8cfbf;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14110f;
        --ink: #f1e9dc;
        --muted: #8f8374;
        --accent: #f0714a;
        --rule: #2d2722;
      }
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { height: 100%; }

    body {
      min-height: 100%;
      margin: 0;
      display: grid;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      display: grid;
      align-content: center;
      min-height: 100dvh;
      padding: clamp(1.5rem, 6vw, 5rem);
      max-width: 72rem;
      margin-inline: auto;
      width: 100%;
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-block-end: clamp(1.5rem, 4vw, 3rem);
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .dot {
      inline-size: 0.6rem;
      block-size: 0.6rem;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(2.75rem, 11vw, 9rem);
      line-height: 0.98;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.7); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="rule" aria-hidden="true"><span class="dot"></span><span>In progress</span></div>
    <h1>Whoever is happy will make <em>others happy too.</em></h1>
  </main>
</body>
</html>
