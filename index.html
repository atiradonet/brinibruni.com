<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Whoever is happy will make others happy too. Anne Frank.">
  <meta name="theme-color" content="#f3ede2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
  <title>Whoever is happy will make others happy too</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d9542b'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3ede2;
      --ink: #1c1814;
      --muted: #7a6f63;
      --accent: #d9542b;
      --rule: #d8cfbf;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14110f;
        --ink: #f1e9dc;
        --muted: #8f8374;
        --accent: #f0714a;
        --rule: #2d2722;
      }
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { height: 100%; }

    body {
      min-height: 100%;
      margin: 0;
      display: grid;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      display: grid;
      align-content: center;
      min-height: 100dvh;
      padding: clamp(1.5rem, 6vw, 5rem);
      max-width: 72rem;
      margin-inline: auto;
      width: 100%;
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-block-end: clamp(1.5rem, 4vw, 3rem);
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .dot {
      inline-size: 0.6rem;
      block-size: 0.6rem;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    .quotes { display: grid; }

    figure {
      grid-area: 1 / 1;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s ease, visibility 0s linear 0.9s;
    }

    figure.is-active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.9s ease 0.9s, visibility 0s linear 0.9s;
    }

    blockquote {
      margin: 0;
      font-weight: 400;
      font-size: clamp(2.5rem, 8.5vw, 7rem);
      line-height: 1.02;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    blockquote em {
      font-style: italic;
      color: var(--accent);
    }

    figcaption {
      margin-block-start: clamp(1.5rem, 4vw, 3rem);
      color: var(--muted);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    figcaption::before {
      content: "\2014\00a0";
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.7); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      figure, figure.is-active { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="rule" aria-hidden="true"><span class="dot"></span><span>A thought</span></div>
    <div class="quotes">
      <figure class="is-active">
        <blockquote>
          <p>Whoever is happy will make <em>others happy too.</em></p>
        </blockquote>
        <figcaption>Anne Frank</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>Try to be a rainbow in <em>someone&rsquo;s cloud.</em></p>
        </blockquote>
        <figcaption>Maya Angelou</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>Very little is needed to make <em>a happy life.</em></p>
        </blockquote>
        <figcaption>Marcus Aurelius</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>Alone we can do so little; <em>together we can do so much.</em></p>
        </blockquote>
        <figcaption>Helen Keller</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>No act of kindness, no matter how small, <em>is ever wasted.</em></p>
        </blockquote>
        <figcaption>Aesop</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>How far that little candle <em>throws his beams!</em></p>
        </blockquote>
        <figcaption>William Shakespeare</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>Hope is the thing <em>with feathers.</em></p>
        </blockquote>
        <figcaption>Emily Dickinson</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>Darkness cannot drive out darkness; <em>only light can do that.</em></p>
        </blockquote>
        <figcaption>Martin Luther King Jr.</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>We must cultivate <em>our garden.</em></p>
        </blockquote>
        <figcaption>Voltaire</figcaption>
      </figure>
      <figure>
        <blockquote>
          <p>Where there&rsquo;s hope, <em>there&rsquo;s life.</em></p>
        </blockquote>
        <figcaption>Anne Frank</figcaption>
      </figure>
    </div>
  </main>
  <script>
    const quotes = document.querySelectorAll("figure");
    let current = 0;

    setInterval(() => {
      quotes[current].classList.remove("is-active");
      current = (current + 1) % quotes.length;
      quotes[current].classList.add("is-active");
    }, 8000);
  </script>
</body>
</html>
